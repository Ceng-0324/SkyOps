name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install Open3D native runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgomp1 libidn2-0 libgfortran5

      - name: Verify native runtime and application imports
        working-directory: backend
        run: uv run --frozen python -c "import open3d; import app.main"

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Run backend lint
        working-directory: backend
        run: uv run ruff check .

      - name: Check backend formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Set up Node.js for API integration smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify F01–F04 frontend clients against the real backend
        working-directory: backend
        run: uv run python ../frontend/scripts/smoke-environment.py --workspace

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend data and interactions
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
